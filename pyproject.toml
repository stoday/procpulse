[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procpulse"
version = "0.1.0"
description = "A synchronous cross-platform external process manager."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["procpulse*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
